services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:3000"
    networks: [control]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/coolify:/data/coolify:ro
      - dockhand-data:/app/data

volumes:
  dockhand-data: {}

networks:
  control:
    name: microstack-control
    external: true
