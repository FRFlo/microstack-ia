name: Vérifier la configuration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le script et les fichiers Compose
        run: |
          bash -n scripts/deploy-dockhand.sh
          docker compose -f docker-compose.dockhand.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml --profile monitoring-agent config --quiet
          docker compose -f docker-compose.yml --profile agents config --quiet
