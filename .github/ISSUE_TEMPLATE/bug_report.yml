name: Signaler un problème
description: Aidez-nous à reproduire un dysfonctionnement.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description et étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Distribution Linux, versions de Docker et de Compose, messages utiles sans secrets.
    validations:
      required: true
