services:
  t3code:
    image: ghcr.io/dizys/t3code-docker:latest
    profiles: [agents]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${T3CODE_PORT:-8021}:3773"
    volumes:
      - t3code-data:/data/userdata
      - t3code-workspace:/data/workspace
      - t3code-home:/home/node
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3773',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BESZEL_PORT:-8002}:8090"
    volumes:
      - beszel-data:/beszel_data
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
  beszel-agent:
    image: henrygd/beszel-agent:latest
    profiles: [monitoring-agent]
    restart: unless-stopped
    environment:
      KEY: ${BESZEL_AGENT_KEY:-}
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  t3code-data: {}
  t3code-home: {}
  t3code-workspace: {}
  beszel-data: {}
  beszel-agent-data: {}
networks:
  monitoring: {}
