services:
  coolify:
    image: docker.io/coollabsio/coolify:latest
    container_name: coolify
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - /data/coolify/source/.env
    environment:
      APP_ENV: production
      PHP_MEMORY_LIMIT: 256M
      PUSHER_BACKEND_PORT: 6001
    ports:
      - "127.0.0.1:8001:8080"
      - "127.0.0.1:6001:6001"
      - "127.0.0.1:6002:6002"
    expose:
      - "6001"
      - "6002"
    volumes:
      - /data/coolify/source/.env:/var/www/html/.env:ro
      - /data/coolify/ssh:/var/www/html/storage/app/ssh
      - /data/coolify/applications:/var/www/html/storage/app/applications
      - /data/coolify/databases:/var/www/html/storage/app/databases
      - /data/coolify/services:/var/www/html/storage/app/services
      - /data/coolify/backups:/var/www/html/storage/app/backups
      - /data/coolify/images:/var/www/html/storage/app/images
    networks:
      coolify:
        aliases:
          - coolify-realtime
      control: {}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/api/health && curl --fail http://127.0.0.1:6001/up || exit 1"]
      interval: 5s
      retries: 24
      start_period: 1m
      timeout: 2s
  postgres:
    image: postgres:latest
    container_name: coolify-db
    restart: unless-stopped
    env_file:
      - /data/coolify/source/.env
    entrypoint: ["/bin/sh", "-c", "export POSTGRES_USER=\"$${DB_USERNAME:-coolify}\" POSTGRES_DB=\"$${DB_DATABASE:-coolify}\" POSTGRES_PASSWORD=\"$${DB_PASSWORD:?DB_PASSWORD requis}\"; exec /usr/local/bin/docker-entrypoint.sh postgres"]
    volumes:
      - coolify-db:/var/lib/postgresql
    networks: [coolify]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USERNAME:-coolify}\" -d \"$${DB_DATABASE:-coolify}\""]
      interval: 5s
      retries: 10
      timeout: 2s
  redis:
    image: redis:latest
    container_name: coolify-redis
    restart: unless-stopped
    env_file:
      - /data/coolify/source/.env
    command: ["sh", "-c", "exec redis-server --save 20 1 --loglevel warning --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - coolify-redis:/data
    networks: [coolify]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 10
      timeout: 2s
  t3code:
    image: ghcr.io/dizys/t3code-docker:latest
    restart: unless-stopped
    env_file:
      - /data/coolify/source/t3code.env
    environment:
      T3_SETUP_KEY: ${T3_SETUP_KEY:-}
    ports:
      - "127.0.0.1:8003:3773"
      - "127.0.0.1:8004:3774"
    volumes:
      - t3code-workspace:/workspace
      - t3code-home:/home/t3
      - t3code-services:/var/lib/t3code/services
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [control]
    shm_size: 1gb
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3773',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8090"
    volumes:
      - beszel-data:/beszel_data
    networks: [monitoring, control]
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
  beszel-agent:
    image: henrygd/beszel-agent:latest
    profiles: [monitoring-agent]
    restart: unless-stopped
    environment:
      KEY: ${BESZEL_AGENT_KEY:-}
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  t3code-home: {}
  t3code-workspace: {}
  t3code-services: {}
  beszel-data: {}
  beszel-agent-data: {}
  coolify-db:
    name: coolify-db
  coolify-redis:
    name: coolify-redis
networks:
  monitoring: {}
  coolify:
    name: coolify
    driver: bridge
  control:
    name: microstack-control
    external: true
